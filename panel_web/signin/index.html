<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>v-bot — Sign in</title>
<link rel="stylesheet" href="../../style.css">
</head>
<body class="signin-page">
<main class="signin-shell">
  <section class="auth-card signin-card" aria-labelledby="signin-title">
    <div class="brand auth-brand">
      <span class="brand-mark">v</span>
      <div><strong>v-bot</strong><small>Management Panel</small></div>
    </div>

    <div class="signin-heading">
      <span class="eyebrow">AUTHENTICATION</span>
      <h1 id="signin-title">Sign in</h1>
      <p class="auth-description">Use your panel access token to manage the v-bot instance.</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <label for="token">Access token</label>
      <div class="input-wrap">
        <input id="token" name="password" type="password" autocomplete="current-password" placeholder="Enter access token" required>
        <button id="viewTokenBtn" class="view-token" type="button">View</button>
      </div>
      <button id="loginBtn" class="primary full" type="submit">Sign in</button>
      <p id="loginError" class="message" role="alert"></p>
      <p id="loginHint" class="hint"></p>
    </form>

    <footer class="signin-footer">v-bot management panel</footer>
  </section>
</main>
<div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>
<script src="../../app.js"></script>
</body>
</html>
